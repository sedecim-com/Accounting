# ARCHIVO ÚNICO DE CI.
# Los paquetes del plan de cierre AÑADEN jobs aquí; ninguno vuelve a crear
# este archivo. Si un paquete necesita una comprobación nueva, agrega un job
# con nombre propio y decláralo en su especificación.
name: CI

on:
  # `push:` sin filtro corría los cinco jobs en cada rama Y otra vez en el PR.
  # En un repositorio público eso es el doble de bitácoras publicadas por el
  # mismo trabajo: las de Actions son legibles por cualquiera.
  push:
    branches: [main]
  pull_request:

# Un push nuevo cancela la corrida anterior de la misma rama. Sin esto, empujar
# tres veces seguidas deja tres corridas compitiendo por el mismo veredicto.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# El token de la corrida es de SOLO LECTURA, dicho aquí y no heredado.
# Hoy lo es porque el ajuste del repositorio (default_workflow_permissions)
# dice "read"; eso se cambia con un clic en una página de configuración, y el
# día que cambie, cada job de un repositorio público le entregaría un token con
# escritura al árbol de dependencias que `npm ci` ejecuta.
permissions:
  contents: read

env:
  NODE_VERSION: '20'

jobs:
  typecheck:
    name: Tipos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck:tests

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # eslint.config.mjs: los errores rompen la CI; las advertencias que
      # entran por tipos de terceros están topadas con --max-warnings, así
      # que el trabajo también falla si su número sube.
      - run: npm run lint

  unit:
    name: Pruebas unitarias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm test
      # Trinquete por archivo sobre el motor contable: no exige trabajo nuevo,
      # impide la regresión. Los umbrales viven en vitest.config.ts.
      - run: npx vitest run --coverage

  plan:
    name: Estado del plan
    runs-on: ubuntu-latest
    # POSTGRES AQUÍ, Y NO ES UN EXTRA (S3).
    #
    # `Criterio.necesita: 'base-de-datos'` existía desde el principio y NUNCA
    # había juzgado nada: este job no tenía base, así que el único criterio que
    # lo declaraba salía siempre `no-evaluable` y el trinquete pasaba igual —
    # un campo declarado que nadie honra promete una semántica y entrega otra.
    # S3 convirtió en criterios DE EFECTO los dos que vigilaban la purga de la
    # 040 y la siembra de la 043 (leían el .sql y no podían distinguir «corrió»
    # de «no tocó nada»), y sin base aquí seguirían sin juzgar.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mnemosine_plan
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mnemosine_plan
      MIGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mnemosine_plan
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run migrate
      # TRINQUETE, NO INFORME.
      #
      # La salida completa se imprime siempre —un paquete abierto es
      # información, no un fallo—, pero --exigir convierte en rojo el
      # RETROCESO de los que ya están cerrados. Sin eso el comando sería otra
      # tabla que nadie mira, que es justo lo que vino a reemplazar.
      #
      # Esta lista sólo crece... salvo cuando un paquete se REABRE con causa.
      # E1.2 y E4.1 salieron en el mismo commit que les añadió criterios de
      # SALIDA que estaban en falso verde: E1.2 prometía rastro en
      # cfdi_classifications y la tabla tiene cero menciones en src; E4.1 lee
      # paycheck_taxes / employer_tax_liabilities / garnishments y ningún
      # camino las escribe (941/940 en ceros). Quitarlos de aquí ES el acto
      # honesto que el trinquete exige hacer a la vista: la reapertura viaja
      # en el diff, con su porqué, y vuelven a la lista cuando su salida
      # exista de verdad. Cuando un paquete cierre, se añade en el mismo
      # commit que lo cierra.
      #
      # S1 (auditoría 2026-08-31): E3.2 sale por la MISMA causa que E1.2/E4.1
      # — era un falso verde: su criterio pasaba porque una regex matcheaba
      # dos cadenas de prosa en una pregunta de política, no código. La
      # descarga masiva del SAT no existe (11 tareas de motor). Vuelve cuando
      # el motor exista de verdad.
      # --piso: EL TRINQUETE POR CRITERIO (S2).
      #
      # --exigir protege paquetes, y el estado de un paquete es el peor de sus
      # criterios: uno YA abierto absorbe cualquier regresión interna sin mover
      # el veredicto. La auditoría II lo demostró creando un archivo que sólo
      # NOMBRABA postJournalEntry — la cerca del agente se puso roja y esta
      # misma línea siguió saliendo con 0. El piso nombra uno a uno los verdes
      # que viven en paquetes abiertos, y falla en tres direcciones: si uno
      # regresa, si un enunciado se renombró sin actualizar la lista, y si un
      # verde nuevo no se añadió al piso en el commit que lo ganó.
      - run: npm run plan:status -- --piso --exigir=E0.0,E0.1,E0.2,E0.3,E1.1,E1.2,E1.3,E2.1,E2.2,E3.1
      # El catálogo de comandos publica cuánto de su superficie existe ya. Ese
      # número estaba escrito a mano y duró 42 commits: decía «~30 comandos»
      # con 106 que el binario ejecuta. Ahora se genera, y esto falla ante tres
      # cosas: que el bloque esté sin regenerar, que los invocables caigan por
      # debajo del suelo de docs/catalogo-minimos.json, y que vuelva a haber un
      # comando vivo sin fila — el desajuste que hacía que `report` entregara
      # ocho comandos y cerrara cero filas.
      - run: npx tsx scripts/catalogo-estado.ts --check
      # El corpus que el agente lee como VERDAD. Un manual desfasado no lo
      # desinforma: lo mal-instruye, y su lector no puede dudar. Esto falla
      # cuando cambia una fuente de un manual ya revisado — no verifica el
      # contenido (eso sería medir prosa), detecta caducidad y nombra qué releer.
      - run: npx tsx scripts/corpus-manifiesto.ts --check
      # El contrato de la API (docs/openapi.json) se GENERA de la pila real de
      # Express: rutas, esquemas de Zod, permisos y clase de riesgo salen de los
      # manejadores montados. Esto falla cuando la copia publicada dejó de
      # coincidir con las rutas — es sólo la frescura del archivo; que la
      # especificación CUBRA todas las rutas lo exige la suite
      # (tests/api/routes/openapi-contrato.spec.ts) y no depende de que nadie
      # se acuerde de regenerar.
      - run: npx tsx scripts/openapi.ts --check

  # EL ENSAYO DE LA RESTAURACIÓN (S3).
  #
  # Un respaldo no probado no es un respaldo. Este job siembra, respalda,
  # RESTAURA en otra base y le corre los chequeos del mayor: es la única
  # forma de que «se pueden recuperar los libros» deje de ser una promesa.
  # Va aparte del job de integración porque necesita las herramientas de
  # cliente de Postgres (pg_dump/pg_restore) y un rol que pueda volcar.
  restauracion:
    name: Ensayo de restauración
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mnemosine_restore
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mnemosine_restore
      MIGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mnemosine_restore
      BACKUP_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mnemosine_restore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # pg_dump/pg_restore del cliente 15: el respaldo lo hacen las
      # herramientas de Postgres, no este proceso.
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client-15 || sudo apt-get install -y postgresql-client
      - run: npm ci
      - run: npm run migrate
      # Un PREFIJO, no una lista de archivos. `s3-corredor.int.spec.ts` se
      # retiró al quitar la mitad duplicada del corredor y la lista se quedó
      # nombrándolo: vitest ignora en silencio una ruta que no existe, así que
      # el trabajo llevaba corriendo la mitad de lo que su propia línea decía,
      # en verde. El argumento posicional de vitest es un filtro de SUBCADENA
      # sobre la ruta —no un glob; un glob no casa nada y aquí eso sería otro
      # modo de mentir—. Con el prefijo, un `s3-*` nuevo entra solo, y si algún
      # día no queda ninguno vitest sale 1 con «No test files found» en vez de
      # dar verde por no mirar.
      - run: npx vitest run --config vitest.integration.config.ts tests/integration/s3-
        env:
          TEST_ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

  integration:
    name: Integración contra Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mnemosine_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mnemosine_test
      MIGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mnemosine_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run migrate
      - run: npm run test:integration
        env:
          TEST_ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

  aislamiento:
    name: Aislamiento por inquilino
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mnemosine_iso
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      # La APLICACIÓN conecta como mnemosine_app, que es el punto entero de
      # este job: corriendo como superusuario la RLS no filtra nada y una
      # política ausente jamás se detectaría. Es el único requisito que los
      # dos planes levantaron por separado y que ninguno había cerrado.
      DATABASE_URL: postgresql://mnemosine_app:ci_app_pw@localhost:5432/mnemosine_iso
      # Las migraciones sí necesitan al dueño del esquema.
      MIGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mnemosine_iso
      SUPERUSER_URL: postgresql://postgres:postgres@localhost:5432/mnemosine_iso
      MNEMOSINE_APP_PASSWORD: ci_app_pw
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Los roles son objetos de nivel clúster, así que no están en la cadena
      # de migraciones: sin este paso el bucle de GRANT de rls-policies.sql no
      # encuentra a quién otorgar y sale sin hacer nada.
      - name: Aprovisionar roles de base
        run: |
          psql "$SUPERUSER_URL" \
            -v app_pw="$MNEMOSINE_APP_PASSWORD" \
            -v owner_pw=ci_owner_pw \
            -f scripts/provision-roles.sql
      - run: npm run migrate
      # verify-isolation.sh necesita un tenant con entidad para comparar
      # contra el que él mismo crea; sin siembra su primera comprobación
      # compara contra vacío y no prueba nada.
      - run: npm run seed
        env:
          DATABASE_URL: ${{ env.MIGRATION_DATABASE_URL }}
      - run: bash scripts/verify-isolation.sh
