# Actualizaciones agrupadas. Sin agrupar, cada semana llegan diez PR de un
# parche cada uno y el ruido acaba por hacer que nadie los mire.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # vitest y su proveedor de cobertura exigen la MISMA versión exacta el uno
      # del otro (peer). Por separado, cada PR rompe `npm ci` con ERESOLVE en
      # los siete jobs: fue #207 (vitest 5 sobre coverage 4) y #289 (coverage 5
      # sobre vitest 4). Juntos, en cualquier tipo de subida, mayores incluidas.
      # Va ANTES del grupo genérico porque Dependabot asigna cada dependencia al
      # primer grupo que la reclama.
      vitest:
        patterns: ['vitest', '@vitest/*']
      menores-y-parches:
        update-types: [minor, patch]
    # Mayores que no son una subida sino una migración. Cada una se hace en su
    # propia issue, no en el PR de Dependabot, que sólo cambia el lockfile:
    #   · zod 4 reescribe la API que usan el middleware de validación, el
    #     conversor Zod→OpenAPI y los esquemas (#352, cerrado; la migración es #367).
    #   · typescript 7 queda fuera del peer de typescript-eslint (<6.1) y
    #     `npm ci` falla con ERESOLVE (#351, cerrado). Se quita la exclusión
    #     cuando typescript-eslint lo soporte.
    ignore:
      - dependency-name: zod
        update-types: ['version-update:semver-major']
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      acciones:
        patterns: ['*']
