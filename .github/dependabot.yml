# Actualizaciones agrupadas. Sin agrupar, cada semana llegan diez PR de un
# parche cada uno y el ruido acaba por hacer que nadie los mire.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      menores-y-parches:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      acciones:
        patterns: ['*']
