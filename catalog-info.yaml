# catalog-info.yaml — la ficha de este repo en el inventario de la plataforma Sedecim.
#
# Formato: Framework de Desarrollo Agéntico, §1.1. El inventario de la
# plataforma es la suma de estos archivos; platform-docs los agrega cuando
# exista (hoy no existe: ver docs/platform/README.md).
#
# Los campos los llenó un agente leyendo el código y el historial, marcados
# `# inferido`; el owner los confirmó todos el 2026-09-30 (#337) y las marcas
# se quitaron. Un campo nuevo que llene un agente vuelve a llevar la marca
# hasta que el owner lo confirme en un PR. Las cifras (pruebas, migraciones,
# comandos) NO viven aquí: se preguntan al árbol (AGENTS.md, «Antes de
# escribir una línea»).

name: accounting                 # nombre del repo en GitHub (sedecim-com/Accounting); el producto se llama mnemosine
id_prefix: MNE                   # prefijo de las tareas MNE-<PRD>-<nnn> (§12.5). No ACC: choca con la familia acceso-*
type: service                    # CLI `mnemosine` + API REST /v1 sobre el mismo motor; el producto es el CLI
lifecycle: experimental          # sin despliegue de producción declarado; la ruta al MVP es #329
domain: contabilidad             # contabilidad de despachos y cumplimiento fiscal MX
owners: ["@vic2099"]             # .github/CODEOWNERS
criticality: tier-1              # una caída o un error pierde dinero o datos de clientes del despacho
data_classification: pii         # RFC, CURP, NSS, sueldos y credenciales fiscales (e.firma, CSD) — docs/SCOPE.md
language: typescript
runtime: node-22                 # package.json engines ">=22.12"; CI y docker/Dockerfile en Node 22

provides:
  - api: mnemosine-rest-v1       # contrato v0 = docs/openapi.json, generado del código y vigilado en CI (--check)
    # CONTRACT: the 422 body of every request is pinned byte for byte by
    # tests/api/golden/rest-body.golden.json, recorded on zod 3 and kept on zod 4 by
    # src/utils/zod-client-errors.ts and src/utils/zod-compat.ts (#367). The only
    # changes are two tightenings: JSON 1e999 (Infinity) is rejected wherever zod 3
    # accepted it as a number (T1), and so is an integer beyond 2^53 - 1 on integer
    # fields (T2). Where zod 3 already rejected 1e999 (a field that is not a number,
    # an integer, a bound it breaks), the 422 is the one zod 3 gave.
    # CONTRACT: /v1/admin/integrations no longer lists `s3`, and every
    # /v1/admin/integrations/s3 route answers 422 PROVIDER_NOT_FOUND (#370). The adapter
    # was a stub that kept the tenant's AWS keys and reported healthy without calling
    # AWS; migration 102 deletes the keys already stored. There is no storage integration.
    # CONTRACT: GET /v1/reports/trial-balance without `account_level` returns every
    # account; it used to default to 5 and drop the deeper ones (#100). A given
    # `account_level` rolls each subtree up into its ancestors before cutting, and a
    # value that is not a whole number of at least 1 answers 422 VALIDATION_ERROR.
  - cli: mnemosine               # superficie medida por `npm run catalogo:estado`
    # CONTRACT: mnemosine.config.json is refused with the same zod 3 prose, pinned by
    # tests/ai/providers/config-contract.spec.ts (#367), and the same two tightenings
    # apply: 1e999 as budget.daily_usd, budget.monthly_usd or ingest.auto_post_max_amount
    # (T1), and an integer beyond 2^53 - 1 as compaction.threshold_tokens,
    # keep_recent_tokens or max_memory_flushes (T2). A file zod 3 loaded with such a
    # value is refused, and every command that reads the config reports why.
  - file: sat-anexo24            # XML de catálogo, balanza, pólizas y auxiliares (a requerimiento, MNE-001-054); DIOT, SUA, CFDI de nómina (los presenta el contribuyente, en el portal). El sellado con la e.firma bajo sellar_con_custodia entra al MVP (#442), sin construir todavía
    # CONTRACT: `diot export --layout sat` writes the DIOT batch .txt the SAT portal
    # uploads: 54 pipe-separated fields per third party, whole pesos, UTF-8, CRLF between
    # records, per the SAT instructivo of January 2025 cited in
    # src/services/sat/diot/sat-batch.ts (fiscal years 2025 onward; earlier periods are
    # refused). It generates only; a person uploads it (#307).

consumes: []                     # ningún contrato de otro repo de Sedecim hoy. Lo externo va en `external`

# Extensión propuesta al esquema del framework: los servicios de terceros no
# son contratos entre repos, pero la matriz de impacto y PLATFORM.md los
# necesitan (guía de implementación, Fase 3: «Lista de dependencias externas»).
external:
  - contalink                    # sistema contable externo: lectura (onboarding, diff de balanza) y escritura por la cola revisada ai_external_ops
    # CONTRACT: src/services/integrations/accounting/registry.ts builds the Contalink adapter
    # only with the acting entity's own key (external_system_credentials + vault, migration
    # 171, #357). The key's RFC is ATTESTED by whoever registers it (mnemosine init --section
    # import), must equal the entity's RFC at registration and is re-checked against the
    # entity's current RFC at every use. Nothing reads back from Contalink which company the
    # key opens. There is no process-wide CONTALINK_API_KEY.
  - sat-consulta-cfdi            # estado de CFDI ante el SAT
  - sat-descarga-masiva          # servicio web del SAT autenticado con la e.firma; en el MVP desde el 2026-09-28 (#312). La autenticación (#439) y el motor de solicitud, verificación y descarga (#440 1/2) existen; los comandos y la ingesta de paquetes no (#440 2/2, #441)
    # CONTRACT: src/services/sat-download/ws-security.ts builds the Autentica request of the
    # SAT Descarga Masiva service v1.5 (SOAPAction
    # http://DescargaMasivaTerceros.gob.mx/IAutenticacion/Autentica, endpoint in config
    # sat.descargaMasivaAuthUrl / SAT_DESCARGA_AUTH_URL): a WS-Security Timestamp signed with
    # XML-DSig (exclusive c14n, SHA-1 digest, RSA-SHA1) and the e.firma certificate as an
    # X509v3 BinarySecurityToken. The key is read only inside withCredential (purpose
    # sat_auth); the token is held in memory for its validity and never stored (#439).
    # CONTRACT: src/services/sat-download/descarga-masiva.ts sends SolicitaDescargaEmitidos /
    # SolicitaDescargaRecibidos, VerificaSolicitudDescarga and Descargar (v1.5; endpoints in
    # config sat.descargaMasiva{Solicita,Verifica,Descarga}Url), each body with an enveloped
    # XML-DSig by the e.firma (purpose sat_auth) and the token as WRAP access_token. The SAT
    # codes and their sources live in sat-codes.ts; the lifetime limit on identical XML
    # requests (5002) is refused before the call by sat_download_quota (migration 167, #440).
  - pac                          # timbrado; adaptadores sin contrato firmado, fuera del MVP
  - model-providers              # Anthropic y compatibles con OpenAI (incluye Hermes); hay camino manual sin modelo
  - aws-secrets-manager          # backend del vault de credenciales fiscales; local-dev en desarrollo
  - zkverify                     # anclaje de sellos; opcional

depends_on_libs: []
datastores:
  - "postgres:mnemosine"         # dueño único; RLS por inquilino
  - "redis:rate-limit"           # sólo el limitador de la API REST

related_repos:                   # extensión propuesta; ver docs/platform/inventory.md
  - repo: sedecim-com/accounting-manager
    relation: coexiste           # ADR-0004: contabiliza las comisiones de Grupo Promessa; un solo escritor por compañía de Contalink (RFC)
  - repo: sedecim-com/mx2
    relation: llama-a-accounting-manager   # quien dispara /accounting/policies/manual (docs/platform/harmony-review.md)
  - repo: sedecim-com/acceso-rbac
    relation: identidad-candidata          # issuer = user pool de Cognito de Acceso; decisión en #371. La API ya acepta sus access tokens con AUTH_OIDC_PROVIDER=cognito (#369)
  - repo: sedecim-com/acceso-organizations
    relation: mapeo-por-rfc                # organization ↔ entity (#371)
  - repo: sedecim-com/sat-services
    relation: duplica                      # descarga masiva con e.firma; entra al MVP por la decisión del 2026-09-28 (#312). #439 la construye aquí: la llave sólo se descifra dentro de withCredential, sin salir a otro servicio
  - repo: sedecim-com/hash-stamper
    relation: productor-candidato          # constancia NOM-151 (#374)
  - repo: sedecim-com/catalogs
    relation: duplica                      # catálogos del SAT
  - repo: sedecim-com/sedecim-ocr-service
    relation: productor-candidato          # OCR v2 de estados de cuenta y facturas no XML
  - repo: sedecim-com/pdf-generator
    relation: productor-candidato          # PDF de estados financieros y recibos
